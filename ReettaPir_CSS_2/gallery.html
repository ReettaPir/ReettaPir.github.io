<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Photo Gallery</title>
    <link href="gallery_styles.css" rel="stylesheet">
    <!--Link to Google font-->
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"> 
</head>
<body>
    <!--Navigation menu-->
    <nav>
        <a href="index.html">Home</a>
        <a href="gallery.html">Gallery</a>
    </nav>
    <section>
    <!--First gallery section-->
    <h2 class="title1">The Northen Lights - Aurora</h2>
        <div class="G1">
            <img 
                class="aurora" 
                src="photo_gallery/aurora.jpg" 
                alt="The Northen Lights"
            />
            <br/>
            <img 
                class="aurora2" 
                src="photo_gallery/aurora 2.jpg" 
                alt="The Northen Lights"
            />
            <br/>
            <img 
                class="aurora3"
                src="photo_gallery/aurora 3.jpg" 
                alt="The Northen Lights"
            />
            <img 
                class="aurora_back" 
                src="photo_gallery/aurora_back.jpg" 
                alt="The Northen Lights"
            />
        </div>
    <!--Second gallery section-->
    <h2 class="title2">Silence In Winter</h2>
        <div class="G2">
            <img 
                class="cabin" 
                src="photo_gallery/cabin.jpg" 
                alt="Cabin"
            />
            <br/>
            <img 
                class="mountain" 
                src="photo_gallery/mountain.jpg" 
                alt="Mountain"
            />
            <br/>
            <img
                class="cabin2" 
                src="photo_gallery/cabin 2.jpg" 
                alt="Cabin"
            />
            <img     
                class="mountain_back" 
                src="photo_gallery/mountain_back.jpg" 
                alt="Mountain"
            />
        </div>
    <!--Third gallery section-->
    <h2 class="title3">Life In The Cold</h2>
        <div class="G3">
            <img 
                class="bird" 
                src="photo_gallery/bird.jpg" 
                alt="Bird"
            />
            <br/>
            <img 
                class="deer" 
                src="photo_gallery/deer.jpg" 
                alt="Deer"
            />
            <br/>
            <img 
                class="bird2" 
                src="photo_gallery/bird 2.jpg" 
                alt="Bird"
            />
            <img 
                class="forest_back" 
                src="photo_gallery/forest_back.jpg" 
                alt="Deer"
            />
        </div>
    </section>
</body>
</html>
